# --- Elena (Moodle) ---
# Every enrolled mata kuliah: course list -> each course's activities
[[pages]]
id = "elena-kursus"
url = "https://elena.unnes.ac.id/my/courses.php"
selector = ".activity-item"
link_selector = "a[href*='/course/view.php']"
render = true
sso_app = "30"
sso_semester = "20261"

# Grades for every enrolled course (Moodle grade overview)
[[pages]]
id = "elena-nilai"
url = "https://elena.unnes.ac.id/grade/report/overview/index.php"
selector = "tbody tr"
render = true
sso_app = "30"
sso_semester = "20261"

