# unnes-cli example configuration (config.toml -> ~/.config/unnes/config.toml or $UNNES_HOME)
# Dispositions: verify with: unnes watch list / unnes fetch <page-id>

[general]
base_url = "https://apps.unnes.ac.id"
default_interval = 900   # seconds between watch daemon passes
min_interval = 60
jitter_fraction = 0.1

[notify]
# command = "notify-send 'unnes'"  # run on change; changelog JSON on stdin

# --- Sikadu / akademik (Livewire -> browser render) ---
[[pages]]
id = "krs"
url = "https://akademik.unnes.ac.id/krs-mahasiswa"
selector = "tbody tr"
render = true
sso_app = "76"

[[pages]]
id = "hasil-studi"
url = "https://akademik.unnes.ac.id/hasil-studi"
selector = "tbody tr"
render = true
sso_app = "76"

# Identity: NIM, angkatan, prodi, dosen wali, kontak (44 fields)
[[pages]]
id = "biodata"
url = "https://akademik.unnes.ac.id/biodata-mahasiswa"
selector = ".detail-item"
render = true
sso_app = "76"

# Schedule (empty until a study plan exists for the active semester)
[[pages]]
id = "jadwal"
url = "https://akademik.unnes.ac.id/jadwal_perkuliahan"
selector = "tbody tr"
render = true
sso_app = "76"

